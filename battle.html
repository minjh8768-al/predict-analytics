<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>예측배틀 — Factory Signal</title>
<meta name="description" content="이미 결과가 나온 실제 예측시장 7개를 무작위로 맞혀보는 턴제 데모 게임. AI의 예측을 이길 수 있을까?">
<style>
  :root {
    --bg: #f5f6fa; --surface: #ffffff; --surface2: #f0f2ff;
    --border: #e2e6f0; --text: #1a1d2e; --text-sub: #5a6075; --text-muted: #9aa0b8;
    --purple: #6c5ce7; --green: #0ea968; --red: #e03040; --yellow: #d97706;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d0d1a; --surface: #16162a; --surface2: #1e1e35;
      --border: #2a2a45; --text: #e8e8f8; --text-sub: #9090b8; --text-muted: #5a5a80;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif; font-size: 13.5px; min-height: 100vh; }

  .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; }
  .logo { font-size: 15px; font-weight: 800; color: var(--purple); text-decoration: none; }
  .logo span { color: var(--text); }
  .header-right { display: flex; align-items: center; gap: 10px; }
  .btn-google { display: flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface2); color: var(--text); font-size: 12.5px; font-weight: 600; cursor: pointer; }
  .btn-logout { font-size: 11.5px; color: var(--text-muted); background: none; border: 1px solid var(--border); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
  .user-name { font-size: 12.5px; color: var(--text-sub); }

  .layout { display: grid; grid-template-columns: 240px 1fr 300px; gap: 14px; padding: 14px; max-width: 1400px; margin: 0 auto; align-items: start; }
  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
  }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
  .card-title { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .04em; font-weight: 700; margin-bottom: 10px; }

  .stat-row { display: flex; justify-content: space-between; padding: 5px 0; font-size: 12.5px; }
  .stat-row .val { font-weight: 700; }
  .val.green { color: var(--green); }
  .val.red { color: var(--red); }
  .val.purple { color: var(--purple); }

  /* ── 진행 현황 ── */
  .progress-steps { display: flex; flex-direction: column; gap: 6px; }
  .progress-step { display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 8px; font-size: 12px; }
  .progress-step.current { background: var(--surface2); font-weight: 700; }
  .progress-step .dot { width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10.5px; font-weight: 800; flex-shrink: 0; background: var(--border); color: var(--text-muted); }
  .progress-step.done .dot.correct { background: var(--green); color: #fff; }
  .progress-step.done .dot.wrong { background: var(--red); color: #fff; }
  .progress-step.done .dot.skip { background: var(--text-muted); color: #fff; }
  .progress-step.current .dot { background: var(--purple); color: #fff; }

  /* ── 중앙: 라운드 ── */
  .round-label { font-size: 12px; color: var(--purple); font-weight: 700; margin-bottom: 8px; }
  .center-question { font-size: 17px; font-weight: 800; line-height: 1.4; margin-bottom: 12px; }
  .center-price-row { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }
  .center-price { font-size: 26px; font-weight: 800; color: var(--purple); }
  .ai-box { display: flex; align-items: center; gap: 8px; background: var(--surface2); border-radius: 10px; padding: 10px 14px; font-size: 12.5px; margin-bottom: 16px; }
  .ai-box .stars { margin-left: auto; color: var(--yellow); }

  .bet-panel { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .outcome-btn { flex: 1; min-width: 110px; padding: 14px; border-radius: 10px; border: 2px solid var(--border); background: var(--surface2); color: var(--text); font-size: 14px; font-weight: 700; cursor: pointer; }
  .outcome-btn.selected.yes { border-color: var(--green); color: var(--green); }
  .outcome-btn.selected.no { border-color: var(--red); color: var(--red); }
  .outcome-btn:disabled { opacity: .5; cursor: not-allowed; }
  #stakeInput { width: 110px; padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface2); color: var(--text); font-size: 14px; }
  .btn-submit { padding: 13px 22px; border-radius: 10px; border: none; background: var(--purple); color: #fff; font-size: 14px; font-weight: 700; cursor: pointer; }
  .btn-submit:disabled { opacity: .5; cursor: not-allowed; }
  .btn-skip { padding: 13px 16px; border-radius: 10px; border: 1px solid var(--border); background: none; color: var(--text-muted); font-size: 12.5px; cursor: pointer; }
  #payoutPreview { font-size: 12px; color: var(--text-sub); width: 100%; margin-top: 6px; }
  #placeError { font-size: 12px; color: var(--red); width: 100%; min-height: 16px; }
  .disclaimer { font-size: 10.5px; color: var(--text-muted); margin-top: 12px; line-height: 1.5; }

  /* ── 결과 공개 ── */
  .reveal-box { text-align: center; padding: 20px 0; }
  .reveal-tag { display: inline-block; padding: 6px 18px; border-radius: 20px; font-size: 15px; font-weight: 800; margin-bottom: 10px; }
  .reveal-tag.correct { background: rgba(14,169,104,.15); color: var(--green); }
  .reveal-tag.wrong { background: rgba(224,48,64,.15); color: var(--red); }
  .reveal-detail { font-size: 13px; color: var(--text-sub); margin-bottom: 18px; }
  .reveal-btns { display: flex; gap: 10px; justify-content: center; }

  /* ── 시작 / 종료 화면 ── */
  .start-screen, .end-screen { text-align: center; padding: 40px 20px; }
  .start-screen h2, .end-screen h2 { font-size: 20px; margin-bottom: 12px; }
  .start-screen p, .end-screen p { color: var(--text-sub); font-size: 13px; margin-bottom: 20px; }
  .btn-primary-lg { padding: 14px 28px; border-radius: 10px; border: none; background: var(--purple); color: #fff; font-size: 14.5px; font-weight: 700; cursor: pointer; }
  .end-stats { display: flex; justify-content: center; gap: 30px; margin-bottom: 22px; }
  .end-stat .num { font-size: 26px; font-weight: 800; }
  .end-stat .label { font-size: 11.5px; color: var(--text-muted); }

  /* ── 우측: 라운드별 결과 ── */
  .pos-item { padding: 10px 0; border-bottom: 1px solid var(--border); }
  .pos-item:last-child { border-bottom: none; }
  .pos-q { font-size: 12px; font-weight: 600; margin-bottom: 4px; }
  .pos-meta { font-size: 11px; color: var(--text-muted); }
  .tag-won { color: var(--green); font-weight: 700; }
  .tag-lost { color: var(--red); font-weight: 700; }
  .tag-void { color: var(--text-muted); font-weight: 700; }
  .empty-state { text-align: center; padding: 24px 0; color: var(--text-muted); font-size: 12.5px; }
</style>
</head>
<body>

<div class="header">
  <a href="index.html" class="logo">Factory<span> Signal</span> · 예측배틀</a>
  <div class="header-right">
    <span class="user-name" id="userName" style="display:none"></span>
    <button class="btn-google" id="loginBtn" onclick="battleLogin()">Google로 로그인</button>
    <button class="btn-logout" id="logoutBtn" style="display:none" onclick="battleLogout()">로그아웃</button>
  </div>
</div>

<div class="layout">

  <!-- 좌측: 스탯 + 진행현황 -->
  <div>
    <div class="card">
      <div class="card-title">내 계좌</div>
      <div class="stat-row"><span>시드머니</span><span class="val">10,000p</span></div>
      <div class="stat-row"><span>보유 포인트</span><span class="val purple" id="statBalance">-</span></div>
    </div>
    <div class="card">
      <div class="card-title">진행 현황 (<span id="progressLabel">0/7</span>)</div>
      <div class="progress-steps" id="progressSteps"></div>
    </div>
  </div>

  <!-- 중앙 -->
  <div class="card" id="centerCard">
    <div class="empty-state">불러오는 중...</div>
  </div>

  <!-- 우측: 라운드별 결과 -->
  <div class="card">
    <div class="card-title">이번 게임 결과</div>
    <div id="resultsList"><div class="empty-state">아직 결과가 없습니다.</div></div>
  </div>

</div>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
  import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
    from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';

  const firebaseConfig = {
    apiKey: "AIzaSyDPnNCfbUSQXfmYhT4g1NMQcfXrVC20Cp0",
    authDomain: "zenithgate-172ec.firebaseapp.com",
    projectId: "zenithgate-172ec",
    storageBucket: "zenithgate-172ec.firebasestorage.app",
    messagingSenderId: "237160059075",
    appId: "1:237160059075:web:3cdf8044bf24a7519c1276"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const provider = new GoogleAuthProvider();
  window._battleAuth = auth;

  window.battleLogin = async function() {
    try { await signInWithPopup(auth, provider); }
    catch (e) { console.warn('로그인 실패:', e.message); }
  };
  window.battleLogout = function() { signOut(auth); };

  onAuthStateChanged(auth, (u) => {
    document.getElementById('loginBtn').style.display = u ? 'none' : 'flex';
    document.getElementById('logoutBtn').style.display = u ? 'inline-block' : 'none';
    const nameEl = document.getElementById('userName');
    nameEl.style.display = u ? 'inline' : 'none';
    nameEl.textContent = u ? (u.displayName || u.email) : '';
    loadBattleStatus();
  });
</script>

<script>
let _session = null;
let _selectedOutcome = null;
let _revealData = null;

function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

async function apiCall(action, extra) {
  const u = window._battleAuth && window._battleAuth.currentUser;
  const headers = { 'Content-Type': 'application/json' };
  if (u) headers['Authorization'] = `Bearer ${await u.getIdToken()}`;
  const r = await fetch('/api/bet', { method: 'POST', headers, body: JSON.stringify({ action, ...extra }) });
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || '요청 실패');
  return data;
}

async function loadBattleStatus() {
  try {
    const data = await apiCall('battleStatus');
    _session = data.session;
    _revealData = null;
    renderBalance(data.battleBalance);
    renderProgress();
    renderCenter();
    renderResultsList();
  } catch (e) {
    document.getElementById('centerCard').innerHTML = `<div class="empty-state">불러오기 실패: ${esc(e.message)}</div>`;
  }
}

function renderBalance(balance) {
  document.getElementById('statBalance').textContent = balance == null ? '로그인 필요' : `${balance.toLocaleString()}p`;
}

async function startNewSession() {
  const u = window._battleAuth && window._battleAuth.currentUser;
  if (!u) { window.battleLogin(); return; }
  document.getElementById('centerCard').innerHTML = '<div class="empty-state">새 게임 준비 중...</div>';
  try {
    const data = await apiCall('battleStartSession');
    _session = data.session;
    _revealData = null;
    renderBalance(data.battleBalance);
    renderProgress();
    renderCenter();
    renderResultsList();
  } catch (e) {
    document.getElementById('centerCard').innerHTML = `<div class="empty-state">시작 실패: ${esc(e.message)}</div>`;
  }
}

function renderProgress() {
  const label = document.getElementById('progressLabel');
  const steps = document.getElementById('progressSteps');
  if (!_session) { label.textContent = '0/7'; steps.innerHTML = ''; return; }
  label.textContent = `${_session.currentRound}/${_session.totalRounds}`;
  steps.innerHTML = Array.from({ length: _session.totalRounds }, (_, i) => {
    const result = _session.results[i];
    const isCurrent = i === _session.currentRound && _session.status === 'active';
    let dotHtml = i + 1;
    let cls = 'progress-step';
    if (result) {
      cls += ' done';
      const dotCls = result.skipped ? 'skip' : result.correct ? 'correct' : 'wrong';
      dotHtml = result.skipped ? '–' : result.correct ? '✓' : '✕';
      return `<div class="${cls}"><span class="dot ${dotCls}">${dotHtml}</span>라운드 ${i + 1}</div>`;
    }
    if (isCurrent) cls += ' current';
    return `<div class="${cls}"><span class="dot">${dotHtml}</span>라운드 ${i + 1}</div>`;
  }).join('');
}

function renderCenter() {
  const el = document.getElementById('centerCard');
  const u = window._battleAuth && window._battleAuth.currentUser;

  if (!u) {
    el.innerHTML = `
      <div class="start-screen">
        <h2>예측배틀에 오신 걸 환영합니다</h2>
        <p>이미 결과가 나온 실제 예측시장 7개를 무작위로 맞혀보세요. AI의 예측도 함께 공개됩니다.</p>
        <button class="btn-primary-lg" onclick="battleLogin()">Google로 로그인</button>
      </div>`;
    return;
  }

  if (_revealData) { renderReveal(); return; }

  if (!_session) {
    el.innerHTML = `
      <div class="start-screen">
        <h2>새 게임을 시작해볼까요?</h2>
        <p>실제로 있었던 예측시장 7개가 무작위로 나옵니다. 예/아니요를 선택하면 결과가 바로 공개돼요.</p>
        <button class="btn-primary-lg" onclick="startNewSession()">게임 시작하기</button>
      </div>`;
    return;
  }

  if (_session.status === 'done') { renderEndScreen(); return; }

  const p = _session.currentPick;
  const pct = Math.round((p.fakeEntryPrice || 0) * 100);
  el.innerHTML = `
    <div class="round-label">라운드 ${_session.currentRound + 1} / ${_session.totalRounds}</div>
    <div class="center-question" id="centerQuestion"></div>
    <div class="center-price-row"><span class="center-price">${pct}%</span><span style="color:var(--text-muted);font-size:12px">시장 확률(추정)</span></div>
    <div class="ai-box">
      <span>${p.aiPrediction === 0 ? '✅' : '❌'}</span>
      <span>AI 예측: <b id="aiPredLabel"></b></span>
      <span class="stars">${'★'.repeat(p.aiConfidence)}${'☆'.repeat(3 - p.aiConfidence)}</span>
    </div>
    <div class="bet-panel">
      <button class="outcome-btn yes" id="btnYes" onclick="selectOutcome(0)"></button>
      <button class="outcome-btn no" id="btnNo" onclick="selectOutcome(1)"></button>
      <input id="stakeInput" type="number" min="10" max="2000" step="10" value="100" oninput="updatePayoutPreview()">
      <button class="btn-submit" id="submitBtn" onclick="submitPosition()" disabled>방향을 선택하세요</button>
      <button class="btn-skip" onclick="skipRound()">베팅 없이 다음</button>
      <div id="payoutPreview">-</div>
      <div id="placeError"></div>
    </div>
    <div class="disclaimer">가상 포인트이며 실제 현금 가치가 없습니다. 실제 자산으로 출금·환전할 수 없습니다. 확률은 실제 당시 시세를 복원할 수 없어 임의로 생성한 값입니다.</div>
  `;
  document.getElementById('centerQuestion').textContent = p.question;
  document.getElementById('btnYes').textContent = p.outcomes[0];
  document.getElementById('btnNo').textContent = p.outcomes[1];
  document.getElementById('aiPredLabel').textContent = p.outcomes[p.aiPrediction];
  _selectedOutcome = null;
}

function selectOutcome(idx) {
  _selectedOutcome = idx;
  document.getElementById('btnYes').classList.toggle('selected', idx === 0);
  document.getElementById('btnYes').classList.toggle('yes', idx === 0);
  document.getElementById('btnNo').classList.toggle('selected', idx === 1);
  document.getElementById('btnNo').classList.toggle('no', idx === 1);
  const btn = document.getElementById('submitBtn');
  btn.disabled = false;
  btn.textContent = '베팅하기';
  updatePayoutPreview();
}

function updatePayoutPreview() {
  const el = document.getElementById('payoutPreview');
  const p = _session && _session.currentPick;
  if (!p || _selectedOutcome == null) { el.textContent = '-'; return; }
  const price = _selectedOutcome === 0 ? p.fakeEntryPrice : 1 - p.fakeEntryPrice;
  const stake = Number(document.getElementById('stakeInput').value);
  if (!(price > 0) || !(stake > 0)) { el.textContent = '-'; return; }
  const payout = Math.round((stake / price) * 100) / 100;
  const returnPct = ((payout - stake) / stake) * 100;
  el.textContent = `적중 시 ${payout.toLocaleString()}p 획득 (수익률 +${returnPct.toFixed(1)}%)`;
}

async function submitPosition() {
  const errEl = document.getElementById('placeError');
  errEl.textContent = '';
  if (_selectedOutcome == null || !_session) return;

  const stake = Number(document.getElementById('stakeInput').value);
  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = '베팅 중...';

  try {
    const data = await apiCall('battlePlace', { sessionId: _session.id, outcomeIndex: _selectedOutcome, stake });
    _revealData = {
      correct: data.correct,
      outcomeLabel: data.outcomeLabel,
      payout: data.payout,
      stake,
      skipped: false,
    };
    renderBalance(data.battleBalance);
    _session.results[_session.currentRound] = { outcomeIndex: _selectedOutcome, stake, correct: data.correct, payout: data.payout, skipped: false };
    _session.currentRound += 1;
    if (_session.currentRound >= _session.totalRounds) _session.status = 'done';
    renderProgress();
    renderResultsList();
    renderCenter();
  } catch (e) {
    errEl.textContent = e.message || '베팅 실패';
    btn.disabled = false;
    btn.textContent = '베팅하기';
  }
}

async function skipRound() {
  if (!_session) return;
  try {
    await apiCall('battleSkipRound', { sessionId: _session.id });
    _revealData = { skipped: true };
    _session.results[_session.currentRound] = { skipped: true };
    _session.currentRound += 1;
    if (_session.currentRound >= _session.totalRounds) _session.status = 'done';
    renderProgress();
    renderResultsList();
    renderCenter();
  } catch (e) {
    document.getElementById('placeError').textContent = e.message || '스킵 실패';
  }
}

function renderReveal() {
  const el = document.getElementById('centerCard');
  const isLast = _session.status === 'done';
  const nextLabel = isLast ? '결과 보기' : '다음 라운드';
  if (_revealData.skipped) {
    el.innerHTML = `
      <div class="reveal-box">
        <div class="reveal-tag" style="background:var(--surface2);color:var(--text-muted)">베팅 없이 넘어감</div>
        <div class="reveal-btns"><button class="btn-primary-lg" onclick="advanceAfterReveal()">${nextLabel}</button></div>
      </div>`;
    return;
  }
  const d = _revealData;
  el.innerHTML = `
    <div class="reveal-box">
      <div class="reveal-tag ${d.correct ? 'correct' : 'wrong'}">${d.correct ? '🎉 적중!' : '😢 실패'}</div>
      <div class="reveal-detail">실제 결과: <b>${esc(d.outcomeLabel)}</b> · ${d.correct ? `+${d.payout.toLocaleString()}p 획득` : `${d.stake.toLocaleString()}p 잃음`}</div>
      <div class="reveal-btns"><button class="btn-primary-lg" onclick="advanceAfterReveal()">${nextLabel}</button></div>
    </div>
  `;
}

function advanceAfterReveal() {
  _revealData = null;
  renderCenter();
}

function renderEndScreen() {
  const el = document.getElementById('centerCard');
  const played = _session.results.filter((r) => r && !r.skipped);
  const correctCount = played.filter((r) => r.correct).length;
  const totalPnl = played.reduce((sum, r) => sum + (r.correct ? r.payout - r.stake : -r.stake), 0);
  el.innerHTML = `
    <div class="end-screen">
      <h2>게임 종료!</h2>
      <div class="end-stats">
        <div class="end-stat"><div class="num">${correctCount}/${played.length}</div><div class="label">적중</div></div>
        <div class="end-stat"><div class="num" style="color:${totalPnl >= 0 ? 'var(--green)' : 'var(--red)'}">${totalPnl >= 0 ? '+' : ''}${Math.round(totalPnl).toLocaleString()}p</div><div class="label">이번 게임 손익</div></div>
      </div>
      <button class="btn-primary-lg" onclick="startNewSession()">새 게임 시작하기</button>
    </div>
  `;
}

function renderResultsList() {
  const el = document.getElementById('resultsList');
  if (!_session) { el.innerHTML = '<div class="empty-state">아직 결과가 없습니다.</div>'; return; }
  const items = _session.results
    .map((r, i) => ({ r, i }))
    .filter((x) => x.r);
  if (!items.length) { el.innerHTML = '<div class="empty-state">아직 결과가 없습니다.</div>'; return; }
  el.innerHTML = items.map(({ r, i }) => {
    if (r.skipped) {
      return `<div class="pos-item"><div class="pos-q">라운드 ${i + 1}</div><div class="pos-meta tag-void">베팅 없이 넘어감</div></div>`;
    }
    const tagClass = r.correct ? 'tag-won' : 'tag-lost';
    const tagLabel = r.correct ? '적중' : '실패';
    const pnl = r.correct ? r.payout - r.stake : -r.stake;
    return `
      <div class="pos-item">
        <div class="pos-q">라운드 ${i + 1}</div>
        <div class="pos-meta">${r.stake.toLocaleString()}p 베팅 <span class="${tagClass}">· ${tagLabel}</span> · ${pnl >= 0 ? '+' : ''}${Math.round(pnl).toLocaleString()}p</div>
      </div>
    `;
  }).join('');
}
</script>

</body>
</html>
