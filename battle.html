<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>예측배틀 — Factory Signal</title>
<meta name="description" content="AI의 방향 예측을 이길 수 있을까? 실시간 마켓 확률 가격의 방향에 가상 포인트로 베팅하는 라운드제 예측배틀.">
<style>
  :root {
    --bg: #f5f6fa; --surface: #ffffff; --surface2: #f0f2ff;
    --border: #e2e6f0; --text: #1a1d2e; --text-sub: #5a6075; --text-muted: #9aa0b8;
    --purple: #6c5ce7; --green: #0ea968; --red: #e03040; --yellow: #d97706;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d0d1a; --surface: #16162a; --surface2: #1e1e35;
      --border: #2a2a45; --text: #e8e8f8; --text-sub: #9090b8; --text-muted: #5a5a80;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif; font-size: 14px; min-height: 100vh; }

  .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; }
  .logo { font-size: 16px; font-weight: 800; color: var(--purple); text-decoration: none; }
  .logo span { color: var(--text); }
  .header-right { display: flex; align-items: center; gap: 10px; }
  .btn-google { display: flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface2); color: var(--text); font-size: 13px; font-weight: 600; cursor: pointer; }
  .btn-logout { font-size: 12px; color: var(--text-muted); background: none; border: 1px solid var(--border); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  .user-name { font-size: 13px; color: var(--text-sub); }

  .container { max-width: 640px; margin: 0 auto; padding: 32px 20px 60px; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 24px; margin-bottom: 20px; }
  .eyebrow { font-size: 11px; color: var(--purple); font-weight: 700; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 10px; }
  .question { font-size: 18px; font-weight: 700; line-height: 1.4; margin-bottom: 18px; }

  .ai-row { display: flex; align-items: center; gap: 10px; background: var(--surface2); border-radius: 10px; padding: 12px 16px; margin-bottom: 16px; }
  .ai-direction { font-size: 20px; }
  .ai-direction.up { color: var(--green); }
  .ai-direction.down { color: var(--red); }
  .ai-label { font-size: 13px; font-weight: 700; }
  .ai-stars { margin-left: auto; font-size: 14px; color: var(--yellow); }

  .meta-row { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--text-muted); margin-bottom: 18px; }
  #countdown { font-weight: 700; color: var(--text); }

  .pool-bar { display: flex; height: 10px; border-radius: 6px; overflow: hidden; margin-bottom: 6px; background: var(--border); }
  .pool-up { background: var(--green); }
  .pool-down { background: var(--red); }
  .pool-labels { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-muted); margin-bottom: 20px; }

  .direction-btns { display: flex; gap: 10px; margin-bottom: 14px; }
  .dir-btn { flex: 1; padding: 14px; border-radius: 10px; border: 2px solid var(--border); background: var(--surface); color: var(--text); font-size: 15px; font-weight: 700; cursor: pointer; }
  .dir-btn.up.selected { border-color: var(--green); background: rgba(14,169,104,.1); color: var(--green); }
  .dir-btn.down.selected { border-color: var(--red); background: rgba(224,48,64,.1); color: var(--red); }

  input#stakeInput { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface2); color: var(--text); font-size: 15px; box-sizing: border-box; margin-bottom: 12px; }
  .btn-submit { width: 100%; padding: 13px; border-radius: 10px; border: none; background: var(--purple); color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; }
  .btn-submit:disabled { opacity: .5; cursor: not-allowed; }
  #placeError { font-size: 12.5px; color: var(--red); margin-top: 8px; min-height: 16px; }

  .balance-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .balance-val { font-size: 20px; font-weight: 800; color: var(--purple); }
  .disclaimer { font-size: 11px; color: var(--text-muted); text-align: center; line-height: 1.5; margin-top: 14px; }

  .position-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12.5px; font-weight: 700; margin-bottom: 14px; }
  .position-badge.up { background: rgba(14,169,104,.12); color: var(--green); }
  .position-badge.down { background: rgba(224,48,64,.12); color: var(--red); }

  .history-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .history-item:last-child { border-bottom: none; }
  .history-q { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
  .history-meta { font-size: 12px; color: var(--text-muted); }
  .tag-ok { color: var(--green); font-weight: 700; }
  .tag-fail { color: var(--red); font-weight: 700; }

  .section-title { font-size: 14px; font-weight: 700; margin-bottom: 12px; }
  .empty-state { text-align: center; padding: 30px 0; color: var(--text-muted); font-size: 13px; }
</style>
</head>
<body>

<div class="header">
  <a href="index.html" class="logo">Factory<span> Signal</span> · 예측배틀</a>
  <div class="header-right">
    <span class="user-name" id="userName" style="display:none"></span>
    <button class="btn-google" id="loginBtn" onclick="battleLogin()">Google로 로그인</button>
    <button class="btn-logout" id="logoutBtn" style="display:none" onclick="battleLogout()">로그아웃</button>
  </div>
</div>

<div class="container">

  <div class="card">
    <div class="eyebrow">이번 라운드</div>
    <div class="question" id="roundQuestion">불러오는 중...</div>

    <div class="ai-row">
      <span class="ai-direction" id="aiArrow">—</span>
      <span class="ai-label" id="aiLabel">AI 예측</span>
      <span class="ai-stars" id="aiStars"></span>
    </div>

    <div class="meta-row">
      <span>남은 시간</span>
      <span id="countdown">—</span>
    </div>

    <div class="pool-bar">
      <div class="pool-up" id="poolUpBar" style="width:50%"></div>
      <div class="pool-down" id="poolDownBar" style="width:50%"></div>
    </div>
    <div class="pool-labels">
      <span>📈 상승 <span id="poolUpVal">0</span>p</span>
      <span>📉 하락 <span id="poolDownVal">0</span>p</span>
    </div>

    <div id="myPositionWrap" style="display:none">
      <span class="position-badge" id="myPositionBadge"></span>
    </div>

    <div id="betForm">
      <div class="direction-btns">
        <button class="dir-btn up" id="btnUp" onclick="selectDirection('up')">📈 상승</button>
        <button class="dir-btn down" id="btnDown" onclick="selectDirection('down')">📉 하락</button>
      </div>
      <input id="stakeInput" type="number" min="10" max="2000" step="10" value="100" placeholder="베팅 금액 (10~2,000)">
      <button class="btn-submit" id="submitBtn" onclick="submitPosition()" disabled>방향을 선택하세요</button>
      <div id="placeError"></div>
    </div>

    <div class="disclaimer">가상 포인트이며 실제 현금 가치가 없습니다. 실제 자산으로 출금·환전할 수 없습니다.</div>
  </div>

  <div class="card">
    <div class="balance-row">
      <span>내 포인트</span>
      <span class="balance-val" id="myBalance">로그인 필요</span>
    </div>
  </div>

  <div class="card">
    <div class="section-title">지난 라운드</div>
    <div id="historyList"><div class="empty-state">아직 지난 라운드가 없습니다.</div></div>
  </div>

</div>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
  import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
    from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';

  const firebaseConfig = {
    apiKey: "AIzaSyDPnNCfbUSQXfmYhT4g1NMQcfXrVC20Cp0",
    authDomain: "zenithgate-172ec.firebaseapp.com",
    projectId: "zenithgate-172ec",
    storageBucket: "zenithgate-172ec.firebasestorage.app",
    messagingSenderId: "237160059075",
    appId: "1:237160059075:web:3cdf8044bf24a7519c1276"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const provider = new GoogleAuthProvider();
  window._battleAuth = auth;

  window.battleLogin = async function() {
    try { await signInWithPopup(auth, provider); }
    catch (e) { console.warn('로그인 실패:', e.message); }
  };
  window.battleLogout = function() { signOut(auth); };

  onAuthStateChanged(auth, (u) => {
    document.getElementById('loginBtn').style.display = u ? 'none' : 'flex';
    document.getElementById('logoutBtn').style.display = u ? 'inline-block' : 'none';
    const nameEl = document.getElementById('userName');
    nameEl.style.display = u ? 'inline' : 'none';
    nameEl.textContent = u ? (u.displayName || u.email) : '';
    loadBattleStatus();
  });
</script>

<script>
let _selectedDirection = null;
let _currentRoundId = null;
let _hasOpenPosition = false;

function selectDirection(dir) {
  if (_hasOpenPosition) return;
  _selectedDirection = dir;
  document.getElementById('btnUp').classList.toggle('selected', dir === 'up');
  document.getElementById('btnDown').classList.toggle('selected', dir === 'down');
  const btn = document.getElementById('submitBtn');
  btn.disabled = false;
  btn.textContent = '베팅하기';
}

function fmtRemaining(endAt) {
  const ms = endAt - Date.now();
  if (ms <= 0) return '정산 대기 중...';
  const m = Math.floor(ms / 60000);
  const s = Math.floor((ms % 60000) / 1000);
  return `${m}분 ${s}초`;
}

let _countdownTimer = null;
let _endAtMs = null;

function startCountdown() {
  if (_countdownTimer) clearInterval(_countdownTimer);
  _countdownTimer = setInterval(() => {
    const el = document.getElementById('countdown');
    if (!_endAtMs) { el.textContent = '—'; return; }
    el.textContent = fmtRemaining(_endAtMs);
  }, 1000);
}

async function loadBattleStatus() {
  const u = window._battleAuth && window._battleAuth.currentUser;
  const headers = { 'Content-Type': 'application/json' };
  if (u) headers['Authorization'] = `Bearer ${await u.getIdToken()}`;

  try {
    const r = await fetch('/api/bet', {
      method: 'POST',
      headers,
      body: JSON.stringify({ action: 'battleStatus' }),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || '조회 실패');
    renderRound(data.round);
    renderHistory(data.history);
    renderBalance(data.battleBalance);
  } catch (e) {
    document.getElementById('roundQuestion').textContent = '불러오기 실패: ' + (e.message || '');
  }
}

function renderRound(round) {
  if (!round) {
    document.getElementById('roundQuestion').textContent = '곧 새 라운드가 시작됩니다...';
    _currentRoundId = null;
    _endAtMs = null;
    document.getElementById('betForm').style.display = 'none';
    return;
  }
  _currentRoundId = round.id;
  document.getElementById('betForm').style.display = 'block';
  document.getElementById('roundQuestion').textContent = round.question;

  const arrowEl = document.getElementById('aiArrow');
  const labelEl = document.getElementById('aiLabel');
  arrowEl.textContent = round.aiDirection === 'up' ? '📈' : '📉';
  arrowEl.className = 'ai-direction ' + round.aiDirection;
  labelEl.textContent = `AI 예측: ${round.aiDirection === 'up' ? '상승' : '하락'}`;
  document.getElementById('aiStars').textContent = '★'.repeat(round.aiConfidence) + '☆'.repeat(3 - round.aiConfidence);

  const endAtMs = typeof round.endAt === 'number' ? round.endAt : (round.endAt?._seconds ? round.endAt._seconds * 1000 : Date.now());
  _endAtMs = endAtMs;
  startCountdown();

  const up = round.upPool || 0, down = round.downPool || 0;
  const total = up + down || 1;
  document.getElementById('poolUpBar').style.width = `${(up / total) * 100}%`;
  document.getElementById('poolDownBar').style.width = `${(down / total) * 100}%`;
  document.getElementById('poolUpVal').textContent = up.toLocaleString();
  document.getElementById('poolDownVal').textContent = down.toLocaleString();

  _hasOpenPosition = !!round.myPosition;
  const wrap = document.getElementById('myPositionWrap');
  const submitBtn = document.getElementById('submitBtn');
  if (round.myPosition) {
    wrap.style.display = 'block';
    const badge = document.getElementById('myPositionBadge');
    badge.className = 'position-badge ' + round.myPosition.direction;
    badge.textContent = `내 포지션: ${round.myPosition.direction === 'up' ? '상승' : '하락'} · ${round.myPosition.stake.toLocaleString()}p`;
    submitBtn.disabled = true;
    submitBtn.textContent = '이번 라운드는 이미 참여했습니다';
  } else {
    wrap.style.display = 'none';
    submitBtn.disabled = !_selectedDirection;
    submitBtn.textContent = _selectedDirection ? '베팅하기' : '방향을 선택하세요';
  }
}

function renderHistory(history) {
  const el = document.getElementById('historyList');
  if (!history || !history.length) {
    el.innerHTML = '<div class="empty-state">아직 지난 라운드가 없습니다.</div>';
    return;
  }
  el.innerHTML = history.map(h => `
    <div class="history-item">
      <div class="history-q">${(h.question || '').replace(/</g, '&lt;')}</div>
      <div class="history-meta">
        결과: ${h.actualDirection === 'up' ? '상승 📈' : h.actualDirection === 'down' ? '하락 📉' : '보합'}
        · AI 예측 ${h.aiDirection === 'up' ? '상승' : '하락'}
        <span class="${h.aiCorrect ? 'tag-ok' : 'tag-fail'}">${h.aiCorrect ? '적중' : '실패'}</span>
      </div>
    </div>
  `).join('');
}

function renderBalance(balance) {
  const el = document.getElementById('myBalance');
  el.textContent = balance == null ? '로그인 필요' : `${balance.toLocaleString()} 포인트`;
}

async function submitPosition() {
  const u = window._battleAuth && window._battleAuth.currentUser;
  const errEl = document.getElementById('placeError');
  errEl.textContent = '';

  if (!u) { errEl.textContent = '로그인이 필요합니다.'; return; }
  if (!_currentRoundId || !_selectedDirection) return;

  const stake = Number(document.getElementById('stakeInput').value);
  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = '베팅 중...';

  try {
    const idToken = await u.getIdToken();
    const r = await fetch('/api/bet', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${idToken}` },
      body: JSON.stringify({ action: 'battlePlace', roundId: _currentRoundId, direction: _selectedDirection, stake }),
    });
    const body = await r.json();
    if (!r.ok) throw new Error(body.error || '베팅 실패');
    await loadBattleStatus();
  } catch (e) {
    errEl.textContent = e.message || '베팅 실패';
    btn.disabled = false;
    btn.textContent = '베팅하기';
  }
}

setInterval(loadBattleStatus, 20000);
</script>

</body>
</html>
