<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>예측배틀 — Factory Signal</title>
<meta name="description" content="AI의 방향 예측을 이길 수 있을까? 라운드마다 큐레이션되는 5개 실시간 마켓에 가상 포인트로 베팅.">
<style>
  :root {
    --bg: #f5f6fa; --surface: #ffffff; --surface2: #f0f2ff;
    --border: #e2e6f0; --text: #1a1d2e; --text-sub: #5a6075; --text-muted: #9aa0b8;
    --purple: #6c5ce7; --green: #0ea968; --red: #e03040; --yellow: #d97706;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d0d1a; --surface: #16162a; --surface2: #1e1e35;
      --border: #2a2a45; --text: #e8e8f8; --text-sub: #9090b8; --text-muted: #5a5a80;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif; font-size: 14px; min-height: 100vh; }

  .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; }
  .logo { font-size: 16px; font-weight: 800; color: var(--purple); text-decoration: none; }
  .logo span { color: var(--text); }
  .header-right { display: flex; align-items: center; gap: 10px; }
  .btn-google { display: flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface2); color: var(--text); font-size: 13px; font-weight: 600; cursor: pointer; }
  .btn-logout { font-size: 12px; color: var(--text-muted); background: none; border: 1px solid var(--border); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  .user-name { font-size: 13px; color: var(--text-sub); }

  .container { max-width: 720px; margin: 0 auto; padding: 32px 20px 60px; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 22px 24px; margin-bottom: 16px; }
  .balance-row { display: flex; justify-content: space-between; align-items: center; }
  .balance-val { font-size: 20px; font-weight: 800; color: var(--purple); }
  .disclaimer { font-size: 11px; color: var(--text-muted); text-align: center; line-height: 1.5; margin-top: 10px; }

  .section-title { font-size: 14px; font-weight: 700; margin: 24px 0 12px; }
  .picks-grid { display: flex; flex-direction: column; gap: 14px; }

  .pick-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 18px 20px; }
  .eyebrow { font-size: 10.5px; color: var(--purple); font-weight: 700; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 6px; }
  .question { font-size: 15px; font-weight: 700; line-height: 1.4; margin-bottom: 12px; }
  .ai-row { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text-sub); margin-bottom: 12px; }
  .ai-row .arrow.up { color: var(--green); }
  .ai-row .arrow.down { color: var(--red); }
  .ai-row .stars { margin-left: auto; color: var(--yellow); }

  .outcome-row { display: flex; gap: 8px; }
  .outcome-btn { flex: 1; padding: 10px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface2); color: var(--text); font-size: 13.5px; font-weight: 700; cursor: pointer; }
  .outcome-btn.yes:hover { border-color: var(--green); color: var(--green); }
  .outcome-btn.no:hover { border-color: var(--red); color: var(--red); }
  .outcome-btn:disabled { opacity: .5; cursor: not-allowed; }
  .pct { display: block; font-size: 11.5px; color: var(--text-muted); font-weight: 400; margin-top: 2px; }

  .my-position-badge { display: inline-block; margin-top: 10px; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; }
  .my-position-badge.won { background: rgba(14,169,104,.12); color: var(--green); }
  .my-position-badge.lost { background: rgba(224,48,64,.12); color: var(--red); }
  .my-position-badge.open { background: rgba(108,92,231,.12); color: var(--purple); }

  .history-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .history-item:last-child { border-bottom: none; }
  .history-q { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
  .history-meta { font-size: 12px; color: var(--text-muted); }
  .tag-won { color: var(--green); font-weight: 700; }
  .tag-lost { color: var(--red); font-weight: 700; }
  .tag-open { color: var(--purple); font-weight: 700; }
  .tag-void { color: var(--text-muted); font-weight: 700; }
  .empty-state { text-align: center; padding: 30px 0; color: var(--text-muted); font-size: 13px; }

  /* ── 베팅 모달 ── */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(10,10,20,.55); z-index: 2000; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
  .modal-overlay.open { display: flex; }
  .modal-content { background: var(--surface); border-radius: 16px; max-width: 380px; width: 92vw; padding: 22px 22px 26px; position: relative; }
  .modal-close { position: absolute; top: 12px; right: 12px; background: var(--surface2); border: 1px solid var(--border); width: 28px; height: 28px; border-radius: 50%; cursor: pointer; font-size: 14px; }
  .modal-title { font-size: 16px; font-weight: 800; margin-bottom: 4px; }
  .modal-sub { font-size: 13px; color: var(--purple); font-weight: 700; margin-bottom: 16px; }
  input#stakeInput { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface2); color: var(--text); font-size: 15px; box-sizing: border-box; margin-bottom: 10px; }
  #payoutPreview { font-size: 12.5px; color: var(--text-sub); margin-bottom: 16px; }
  .btn-submit { width: 100%; padding: 13px; border-radius: 10px; border: none; background: var(--purple); color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; }
  .btn-submit:disabled { opacity: .5; cursor: not-allowed; }
  #placeError { font-size: 12.5px; color: var(--red); margin-top: 8px; min-height: 16px; }
</style>
</head>
<body>

<div class="header">
  <a href="index.html" class="logo">Factory<span> Signal</span> · 예측배틀</a>
  <div class="header-right">
    <span class="user-name" id="userName" style="display:none"></span>
    <button class="btn-google" id="loginBtn" onclick="battleLogin()">Google로 로그인</button>
    <button class="btn-logout" id="logoutBtn" style="display:none" onclick="battleLogout()">로그아웃</button>
  </div>
</div>

<div class="container">

  <div class="card">
    <div class="balance-row">
      <span>내 포인트</span>
      <span class="balance-val" id="myBalance">로그인 필요</span>
    </div>
    <div class="disclaimer">가상 포인트이며 실제 현금 가치가 없습니다. 실제 자산으로 출금·환전할 수 없습니다.</div>
  </div>

  <div class="section-title">이번 라운드 · AI를 이길 수 있을까?</div>
  <div class="picks-grid" id="picksGrid">
    <div class="empty-state">불러오는 중...</div>
  </div>

  <div class="section-title">내 베팅 내역</div>
  <div class="card">
    <div id="historyList"><div class="empty-state">아직 베팅 내역이 없습니다.</div></div>
  </div>

</div>

<div class="modal-overlay" id="betOverlay" onclick="if(event.target===this)closeBetModal()">
  <div class="modal-content">
    <button class="modal-close" onclick="closeBetModal()">✕</button>
    <div class="modal-title" id="betModalQuestion"></div>
    <div class="modal-sub" id="betModalOutcome"></div>
    <label style="font-size:12.5px;color:var(--text-muted);display:block;margin-bottom:6px">베팅 금액 (10~2,000)</label>
    <input id="stakeInput" type="number" min="10" max="2000" step="10" value="100" oninput="updatePayoutPreview()">
    <div id="payoutPreview">-</div>
    <div id="placeError"></div>
    <button class="btn-submit" id="submitBtn" onclick="submitPosition()">베팅하기</button>
  </div>
</div>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
  import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
    from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';

  const firebaseConfig = {
    apiKey: "AIzaSyDPnNCfbUSQXfmYhT4g1NMQcfXrVC20Cp0",
    authDomain: "zenithgate-172ec.firebaseapp.com",
    projectId: "zenithgate-172ec",
    storageBucket: "zenithgate-172ec.firebasestorage.app",
    messagingSenderId: "237160059075",
    appId: "1:237160059075:web:3cdf8044bf24a7519c1276"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const provider = new GoogleAuthProvider();
  window._battleAuth = auth;

  window.battleLogin = async function() {
    try { await signInWithPopup(auth, provider); }
    catch (e) { console.warn('로그인 실패:', e.message); }
  };
  window.battleLogout = function() { signOut(auth); };

  onAuthStateChanged(auth, (u) => {
    document.getElementById('loginBtn').style.display = u ? 'none' : 'flex';
    document.getElementById('logoutBtn').style.display = u ? 'inline-block' : 'none';
    const nameEl = document.getElementById('userName');
    nameEl.style.display = u ? 'inline' : 'none';
    nameEl.textContent = u ? (u.displayName || u.email) : '';
    loadBattleStatus();
  });
</script>

<script>
let _betCtx = null;

function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function escAttrJson(obj) {
  return JSON.stringify(obj)
    .replace(/&/g, '&amp;')
    .replace(/'/g, '&apos;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

async function loadBattleStatus() {
  const u = window._battleAuth && window._battleAuth.currentUser;
  const headers = { 'Content-Type': 'application/json' };
  if (u) headers['Authorization'] = `Bearer ${await u.getIdToken()}`;

  try {
    const r = await fetch('/api/bet', { method: 'POST', headers, body: JSON.stringify({ action: 'battleStatus' }) });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || '조회 실패');
    _currentRoundId = data.roundId;
    renderPicks(data.picks);
    renderHistory(data.recentBets);
    renderBalance(data.battleBalance);
  } catch (e) {
    document.getElementById('picksGrid').innerHTML = `<div class="empty-state">불러오기 실패: ${esc(e.message)}</div>`;
  }
}

let _currentRoundId = null;

function renderPicks(picks) {
  const grid = document.getElementById('picksGrid');
  if (!picks || !picks.length) {
    grid.innerHTML = '<div class="empty-state">곧 새 라운드가 시작됩니다...</div>';
    return;
  }
  grid.innerHTML = picks.map((p) => {
    const pct = Math.round((p.entryPrice || 0) * 100);
    const arrow = p.aiDirection === 'up' ? '📈' : '📉';
    const stars = '★'.repeat(p.aiConfidence) + '☆'.repeat(3 - p.aiConfidence);
    const disabled = p.myPosition ? 'disabled' : '';
    const badge = p.myPosition
      ? `<div class="my-position-badge ${p.myPosition.status === 'won' ? 'won' : p.myPosition.status === 'lost' ? 'lost' : 'open'}">
           내 포지션: ${esc(p.myPosition.outcomeLabel)} · ${p.myPosition.stake.toLocaleString()}p
         </div>`
      : '';
    return `
      <div class="pick-card">
        <div class="eyebrow">실시간 마켓</div>
        <div class="question">${esc(p.question)}</div>
        <div class="ai-row">
          <span class="arrow ${p.aiDirection}">${arrow}</span>
          <span>AI 예측: ${p.aiDirection === 'up' ? '상승' : '하락'}</span>
          <span class="stars">${stars}</span>
        </div>
        <div class="outcome-row">
          <button class="outcome-btn yes" ${disabled} onclick='openBetModal(${escAttrJson({ marketId: p.marketId, outcomeIndex: 0, label: p.outcomes[0], price: p.entryPrice, question: p.question })})'>
            ${esc(p.outcomes[0])}<span class="pct">${pct}%</span>
          </button>
          <button class="outcome-btn no" ${disabled} onclick='openBetModal(${escAttrJson({ marketId: p.marketId, outcomeIndex: 1, label: p.outcomes[1], price: 1 - (p.entryPrice || 0), question: p.question })})'>
            ${esc(p.outcomes[1])}<span class="pct">${100 - pct}%</span>
          </button>
        </div>
        ${badge}
      </div>
    `;
  }).join('');
}

function renderHistory(bets) {
  const el = document.getElementById('historyList');
  if (!bets || !bets.length) {
    el.innerHTML = '<div class="empty-state">아직 베팅 내역이 없습니다.</div>';
    return;
  }
  const tagClass = { open: 'tag-open', won: 'tag-won', lost: 'tag-lost', void: 'tag-void' };
  const tagLabel = { open: '진행중', won: '적중', lost: '실패', void: '무효' };
  el.innerHTML = bets.map((b) => `
    <div class="history-item">
      <div class="history-q">${esc(b.marketQuestion)}</div>
      <div class="history-meta">
        ${esc(b.outcomeLabel)} · ${b.stake.toLocaleString()}p 베팅
        <span class="${tagClass[b.status] || ''}"> · ${tagLabel[b.status] || b.status}</span>
        ${b.status !== 'open' ? ` · ${(b.payout || 0).toLocaleString()}p 정산` : ''}
      </div>
    </div>
  `).join('');
}

function renderBalance(balance) {
  document.getElementById('myBalance').textContent = balance == null ? '로그인 필요' : `${balance.toLocaleString()} 포인트`;
}

function openBetModal(ctx) {
  const u = window._battleAuth && window._battleAuth.currentUser;
  if (!u) { window.battleLogin(); return; }
  _betCtx = ctx;
  document.getElementById('betModalQuestion').textContent = ctx.question;
  document.getElementById('betModalOutcome').textContent = `${ctx.label} · 현재가 ${Math.round(ctx.price * 100)}%`;
  document.getElementById('stakeInput').value = 100;
  document.getElementById('placeError').textContent = '';
  updatePayoutPreview();
  document.getElementById('betOverlay').classList.add('open');
}

function closeBetModal() {
  document.getElementById('betOverlay').classList.remove('open');
  _betCtx = null;
}

function updatePayoutPreview() {
  const el = document.getElementById('payoutPreview');
  if (!_betCtx || !(_betCtx.price > 0)) { el.textContent = '-'; return; }
  const stake = Number(document.getElementById('stakeInput').value);
  if (!(stake > 0)) { el.textContent = '-'; return; }
  const payout = Math.round((stake / _betCtx.price) * 100) / 100;
  el.textContent = `적중 시 ${payout.toLocaleString()} 포인트 획득 (스테이크 포함)`;
}

async function submitPosition() {
  const u = window._battleAuth && window._battleAuth.currentUser;
  const errEl = document.getElementById('placeError');
  errEl.textContent = '';
  if (!u || !_betCtx || !_currentRoundId) return;

  const stake = Number(document.getElementById('stakeInput').value);
  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = '베팅 중...';

  try {
    const idToken = await u.getIdToken();
    const r = await fetch('/api/bet', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${idToken}` },
      body: JSON.stringify({ action: 'battlePlace', roundId: _currentRoundId, marketId: _betCtx.marketId, outcomeIndex: _betCtx.outcomeIndex, stake }),
    });
    const body = await r.json();
    if (!r.ok) throw new Error(body.error || '베팅 실패');
    closeBetModal();
    await loadBattleStatus();
  } catch (e) {
    errEl.textContent = e.message || '베팅 실패';
  } finally {
    btn.disabled = false;
    btn.textContent = '베팅하기';
  }
}

setInterval(loadBattleStatus, 30000);
</script>

</body>
</html>
