<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>예측배틀 — Factory Signal</title>
<meta name="description" content="이미 결과가 나온 실제 예측시장 35개(7라운드 x 5개)를 무작위로 맞혀보는 턴제 데모 게임. AI의 예측을 이길 수 있을까?">
<style>
  :root {
    --bg: #f5f6fa; --surface: #ffffff; --surface2: #f0f2ff;
    --border: #e2e6f0; --text: #1a1d2e; --text-sub: #5a6075; --text-muted: #9aa0b8;
    --purple: #6c5ce7; --green: #0ea968; --red: #e03040; --yellow: #d97706;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d0d1a; --surface: #16162a; --surface2: #1e1e35;
      --border: #2a2a45; --text: #e8e8f8; --text-sub: #9090b8; --text-muted: #5a5a80;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif; font-size: 13.5px; min-height: 100vh; }

  .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; }
  .logo { font-size: 15px; font-weight: 800; color: var(--purple); text-decoration: none; }
  .logo span { color: var(--text); }
  .header-right { display: flex; align-items: center; gap: 10px; }
  .btn-google { display: flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface2); color: var(--text); font-size: 12.5px; font-weight: 600; cursor: pointer; }
  .btn-logout { font-size: 11.5px; color: var(--text-muted); background: none; border: 1px solid var(--border); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
  .user-name { font-size: 12.5px; color: var(--text-sub); }

  .layout { display: grid; grid-template-columns: 220px 1fr 280px; gap: 14px; padding: 14px; max-width: 1500px; margin: 0 auto; align-items: start; }
  @media (max-width: 1000px) {
    .layout { grid-template-columns: 1fr; }
  }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
  .card-title { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .04em; font-weight: 700; margin-bottom: 10px; }

  .stat-row { display: flex; justify-content: space-between; padding: 5px 0; font-size: 12.5px; }
  .stat-row .val { font-weight: 700; }

  /* ── 진행 현황 ── */
  .progress-steps { display: flex; flex-direction: column; gap: 6px; }
  .progress-step { display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 8px; font-size: 12px; }
  .progress-step.current { background: var(--surface2); font-weight: 700; }
  .progress-step .dot { min-width: 26px; height: 20px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 800; flex-shrink: 0; background: var(--border); color: var(--text-muted); padding: 0 4px; }
  .progress-step.done .dot { background: var(--purple); color: #fff; }
  .progress-step.current .dot { background: var(--purple); color: #fff; }

  /* ── 중앙: 라운드 진행 ── */
  .round-label { font-size: 13px; color: var(--purple); font-weight: 700; margin-bottom: 12px; }
  .picks-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
  .pick-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; }
  .pick-q-ko { font-size: 13.5px; font-weight: 700; line-height: 1.35; margin-bottom: 4px; }
  .pick-q-en { font-size: 10.5px; color: var(--text-muted); line-height: 1.3; margin-bottom: 10px; }
  .pick-price-row { font-size: 11.5px; color: var(--text-muted); margin-bottom: 8px; }
  .ai-box-sm { display: flex; flex-direction: column; background: var(--surface2); border-radius: 8px; padding: 7px 10px; font-size: 11px; margin-bottom: 10px; }
  .ai-box-sm .stars { margin-left: auto; color: var(--yellow); }
  .pick-btns { display: flex; gap: 6px; margin-bottom: 6px; }
  .pick-outcome-btn { flex: 1; padding: 8px; border-radius: 8px; border: 2px solid var(--border); background: var(--surface2); color: var(--text); font-size: 12px; font-weight: 700; cursor: pointer; }
  .pick-outcome-btn.selected.yes { border-color: var(--green); color: var(--green); }
  .pick-outcome-btn.selected.no { border-color: var(--red); color: var(--red); }
  .pick-stake-row { display: flex; gap: 6px; margin-top: auto; }
  .pick-stake-row input { width: 70px; padding: 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface2); color: var(--text); font-size: 12.5px; }
  .pick-submit-btn { flex: 1; padding: 8px; border-radius: 8px; border: none; background: var(--purple); color: #fff; font-size: 12px; font-weight: 700; cursor: pointer; }
  .pick-submit-btn:disabled { opacity: .5; cursor: not-allowed; }
  .pick-error { font-size: 10.5px; color: var(--red); margin-top: 4px; min-height: 13px; }

  .pick-reveal { text-align: center; padding: 12px 0; margin-top: auto; }
  .pick-reveal-tag { display: inline-block; padding: 4px 12px; border-radius: 16px; font-size: 12.5px; font-weight: 800; margin-bottom: 6px; }
  .pick-reveal-tag.correct { background: rgba(14,169,104,.15); color: var(--green); }
  .pick-reveal-tag.wrong { background: rgba(224,48,64,.15); color: var(--red); }
  .pick-reveal-tag.skipped { background: var(--surface2); color: var(--text-muted); }
  .pick-reveal-detail { font-size: 11px; color: var(--text-sub); }

  .next-round-bar { display: flex; justify-content: center; margin-top: 16px; }
  .btn-primary-lg { padding: 14px 28px; border-radius: 10px; border: none; background: var(--purple); color: #fff; font-size: 14.5px; font-weight: 700; cursor: pointer; }

  .disclaimer { font-size: 10.5px; color: var(--text-muted); margin-top: 14px; line-height: 1.5; text-align: center; }

  .start-screen, .end-screen { text-align: center; padding: 40px 20px; }
  .start-screen h2, .end-screen h2 { font-size: 20px; margin-bottom: 12px; }
  .start-screen p, .end-screen p { color: var(--text-sub); font-size: 13px; margin-bottom: 20px; }
  .end-stats { display: flex; justify-content: center; gap: 30px; margin-bottom: 22px; }
  .end-stat .num { font-size: 26px; font-weight: 800; }
  .end-stat .label { font-size: 11.5px; color: var(--text-muted); }

  .pos-item { padding: 9px 0; border-bottom: 1px solid var(--border); }
  .pos-item:last-child { border-bottom: none; }
  .pos-q { font-size: 11.5px; font-weight: 600; margin-bottom: 3px; }
  .pos-meta { font-size: 10.5px; color: var(--text-muted); }
  .tag-won { color: var(--green); font-weight: 700; }
  .tag-lost { color: var(--red); font-weight: 700; }
  .tag-void { color: var(--text-muted); font-weight: 700; }
  .empty-state { text-align: center; padding: 24px 0; color: var(--text-muted); font-size: 12.5px; }

  /* ── 정답 컨페티 ── */
  #confettiLayer { position: fixed; inset: 0; pointer-events: none; z-index: 9999; overflow: hidden; }
  .confetti-piece { position: absolute; top: -20px; border-radius: 2px; animation: confetti-fall linear forwards; }
  @keyframes confetti-fall {
    0%   { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(105vh) rotate(720deg); opacity: 0.9; }
  }
</style>
</head>
<body>

<div class="header">
  <a href="index.html" class="logo">Factory<span> Signal</span> · 예측배틀</a>
  <div class="header-right">
    <span class="user-name" id="userName" style="display:none"></span>
    <button class="btn-google" id="loginBtn" onclick="battleLogin()">Google로 로그인</button>
    <button class="btn-logout" id="logoutBtn" style="display:none" onclick="battleLogout()">로그아웃</button>
  </div>
</div>

<div id="confettiLayer"></div>

<div class="layout">

  <div>
    <div class="card">
      <div class="card-title">내 계좌</div>
      <div class="stat-row"><span>시드머니</span><span class="val">10,000p</span></div>
      <div class="stat-row"><span>보유 포인트</span><span class="val" style="color:var(--purple)" id="statBalance">-</span></div>
    </div>
    <div class="card">
      <div class="card-title">진행 현황 (<span id="progressLabel">0/7</span>)</div>
      <div class="progress-steps" id="progressSteps"></div>
    </div>
  </div>

  <div class="card" id="centerCard">
    <div class="empty-state">불러오는 중...</div>
  </div>

  <div class="card">
    <div class="card-title">이번 게임 결과</div>
    <div id="resultsList"><div class="empty-state">아직 결과가 없습니다.</div></div>
  </div>

</div>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
  import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
    from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';

  const firebaseConfig = {
    apiKey: "AIzaSyDPnNCfbUSQXfmYhT4g1NMQcfXrVC20Cp0",
    authDomain: "zenithgate-172ec.firebaseapp.com",
    projectId: "zenithgate-172ec",
    storageBucket: "zenithgate-172ec.firebasestorage.app",
    messagingSenderId: "237160059075",
    appId: "1:237160059075:web:3cdf8044bf24a7519c1276"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const provider = new GoogleAuthProvider();
  window._battleAuth = auth;

  window.battleLogin = async function() {
    try { await signInWithPopup(auth, provider); }
    catch (e) { console.warn('로그인 실패:', e.message); }
  };
  window.battleLogout = function() { signOut(auth); };

  onAuthStateChanged(auth, (u) => {
    document.getElementById('loginBtn').style.display = u ? 'none' : 'flex';
    document.getElementById('logoutBtn').style.display = u ? 'inline-block' : 'none';
    const nameEl = document.getElementById('userName');
    nameEl.style.display = u ? 'inline' : 'none';
    nameEl.textContent = u ? (u.displayName || u.email) : '';
    loadBattleStatus();
  });
</script>

<script>
let _session = null;
let _cardSelections = {}; // pickIdx -> outcomeIndex

function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

const CONFETTI_COLORS = ['#6c5ce7', '#0ea968', '#e03040', '#d97706', '#3b82f6', '#e040fb'];

function fireConfetti() {
  const layer = document.getElementById('confettiLayer');
  const count = 80;
  for (let i = 0; i < count; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    const size = 6 + Math.random() * 6;
    piece.style.left = `${Math.random() * 100}vw`;
    piece.style.width = `${size}px`;
    piece.style.height = `${size * 0.4}px`;
    piece.style.background = CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)];
    piece.style.animationDuration = `${1.2 + Math.random() * 1}s`;
    piece.style.animationDelay = `${Math.random() * 0.3}s`;
    layer.appendChild(piece);
    setTimeout(() => piece.remove(), 2600);
  }
}

async function apiCall(action, extra) {
  const u = window._battleAuth && window._battleAuth.currentUser;
  const headers = { 'Content-Type': 'application/json' };
  if (u) headers['Authorization'] = `Bearer ${await u.getIdToken()}`;
  const r = await fetch('/api/bet', { method: 'POST', headers, body: JSON.stringify({ action, ...extra }) });
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || '요청 실패');
  return data;
}

async function loadBattleStatus() {
  try {
    const data = await apiCall('battleStatus');
    _session = data.session;
    _cardSelections = {};
    renderBalance(data.battleBalance);
    renderProgress();
    renderCenter();
    renderResultsList();
  } catch (e) {
    document.getElementById('centerCard').innerHTML = `<div class="empty-state">불러오기 실패: ${esc(e.message)}</div>`;
  }
}

function renderBalance(balance) {
  document.getElementById('statBalance').textContent = balance == null ? '로그인 필요' : `${balance.toLocaleString()}p`;
}

async function startNewSession() {
  const u = window._battleAuth && window._battleAuth.currentUser;
  if (!u) { window.battleLogin(); return; }
  document.getElementById('centerCard').innerHTML = '<div class="empty-state">새 게임 준비 중... (번역·AI 예측 생성에 몇 초 걸릴 수 있어요)</div>';
  try {
    const data = await apiCall('battleStartSession');
    _session = data.session;
    _cardSelections = {};
    renderBalance(data.battleBalance);
    renderProgress();
    renderCenter();
    renderResultsList();
  } catch (e) {
    document.getElementById('centerCard').innerHTML = `<div class="empty-state">시작 실패: ${esc(e.message)}</div>`;
  }
}

function renderProgress() {
  const label = document.getElementById('progressLabel');
  const steps = document.getElementById('progressSteps');
  if (!_session) { label.textContent = '0/7'; steps.innerHTML = ''; return; }
  label.textContent = `${_session.currentRound}/${_session.totalRounds}`;
  steps.innerHTML = Array.from({ length: _session.totalRounds }, (_, i) => {
    const isPast = i < _session.currentRound;
    const isCurrent = i === _session.currentRound && _session.status === 'active';
    let cls = 'progress-step';
    let dotHtml = i + 1;
    if (isPast) {
      cls += ' done';
      const results = _session.pastRounds[i]?.results || [];
      const correctCount = results.filter((r) => r && r.correct).length;
      dotHtml = `${correctCount}/${results.length}`;
    } else if (isCurrent) {
      cls += ' current';
    }
    return `<div class="${cls}"><span class="dot">${dotHtml}</span>라운드 ${i + 1}</div>`;
  }).join('');
}

function renderCenter() {
  const el = document.getElementById('centerCard');
  const u = window._battleAuth && window._battleAuth.currentUser;

  if (!u) {
    el.innerHTML = `
      <div class="start-screen">
        <h2>예측배틀에 오신 걸 환영합니다</h2>
        <p>이미 결과가 나온 실제 예측시장 35개(7라운드 x 5개)를 무작위로 맞혀보세요. AI의 예측도 함께 공개됩니다.</p>
        <button class="btn-primary-lg" onclick="battleLogin()">Google로 로그인</button>
      </div>`;
    return;
  }

  if (!_session) {
    el.innerHTML = `
      <div class="start-screen">
        <h2>새 게임을 시작해볼까요?</h2>
        <p>실제로 있었던 예측시장이 한 라운드에 5개씩, 총 7라운드(35개) 무작위로 나옵니다. 예/아니요를 선택하면 결과가 바로 공개돼요.</p>
        <button class="btn-primary-lg" onclick="startNewSession()">게임 시작하기</button>
      </div>`;
    return;
  }

  if (_session.status === 'done') { renderEndScreen(); return; }

  const picks = _session.currentRoundPicks;
  const results = _session.currentRoundResults;
  el.innerHTML = `
    <div class="round-label">라운드 ${_session.currentRound + 1} / ${_session.totalRounds}</div>
    <div class="picks-grid" id="picksGrid"></div>
    <div class="next-round-bar"><button class="btn-primary-lg" onclick="goNextRound()">다음 라운드</button></div>
    <div class="disclaimer">가상 포인트이며 실제 현금 가치가 없습니다. 실제 자산으로 출금·환전할 수 없습니다. 확률은 실제 당시 시세를 복원할 수 없어 임의로 생성한 값입니다.</div>
  `;
  const grid = document.getElementById('picksGrid');
  grid.innerHTML = picks.map((p, i) => renderPickCard(p, i, results[i])).join('');
}

function renderPickCard(p, i, result) {
  const pct = Math.round((p.fakeEntryPrice || 0) * 100);
  if (result) {
    if (result.skipped) {
      return `
        <div class="pick-card">
          <div class="pick-q-ko">${esc(p.questionKo)}</div>
          <div class="pick-q-en">${esc(p.question)}</div>
          <div class="pick-reveal"><div class="pick-reveal-tag skipped">베팅 안 함</div></div>
        </div>`;
    }
    return `
      <div class="pick-card">
        <div class="pick-q-ko">${esc(p.questionKo)}</div>
        <div class="pick-q-en">${esc(p.question)}</div>
        <div class="pick-reveal">
          <div class="pick-reveal-tag ${result.correct ? 'correct' : 'wrong'}">${result.correct ? '🎉 적중' : '😢 실패'}</div>
          <div class="pick-reveal-detail">${result.correct ? `+${result.payout.toLocaleString()}p` : `-${result.stake.toLocaleString()}p`}</div>
        </div>
      </div>`;
  }
  const selected = _cardSelections[i];
  return `
    <div class="pick-card">
      <div class="pick-q-ko">${esc(p.questionKo)}</div>
      <div class="pick-q-en">${esc(p.question)}</div>
      <div class="pick-price-row">시장 확률(추정) ${pct}%</div>
      <div class="ai-box-sm">
        <div style="display:flex;align-items:center;gap:6px;width:100%">
          <span>🤖 AI 예측: ${esc(p.outcomes[p.aiPrediction])}</span>
          <span class="stars">${'★'.repeat(p.aiConfidence)}${'☆'.repeat(3 - p.aiConfidence)}</span>
        </div>
        ${p.aiAnalysis ? `<div style="width:100%;margin-top:4px;color:var(--text-sub);font-size:10.5px;line-height:1.4">${esc(p.aiAnalysis)}</div>` : ''}
      </div>
      <div class="pick-btns">
        <button class="pick-outcome-btn yes ${selected === 0 ? 'selected' : ''}" onclick="selectCardOutcome(${i},0)">${esc(p.outcomes[0])}</button>
        <button class="pick-outcome-btn no ${selected === 1 ? 'selected' : ''}" onclick="selectCardOutcome(${i},1)">${esc(p.outcomes[1])}</button>
      </div>
      <div class="pick-stake-row">
        <input id="stakeInput_${i}" type="number" min="10" max="2000" step="10" value="100">
        <button class="pick-submit-btn" id="submitBtn_${i}" onclick="submitCard(${i})" ${selected == null ? 'disabled' : ''}>베팅</button>
      </div>
      <div class="pick-error" id="pickError_${i}"></div>
    </div>`;
}

function selectCardOutcome(i, idx) {
  _cardSelections[i] = idx;
  const el = document.getElementById('centerCard');
  const grid = document.getElementById('picksGrid');
  const picks = _session.currentRoundPicks;
  const results = _session.currentRoundResults;
  grid.children[i].outerHTML = renderPickCard(picks[i], i, results[i]);
}

async function submitCard(i) {
  const errEl = document.getElementById(`pickError_${i}`);
  errEl.textContent = '';
  const outcomeIndex = _cardSelections[i];
  if (outcomeIndex == null || !_session) return;
  const stake = Number(document.getElementById(`stakeInput_${i}`).value);
  const btn = document.getElementById(`submitBtn_${i}`);
  btn.disabled = true;
  btn.textContent = '처리 중...';

  try {
    const data = await apiCall('battlePlace', { sessionId: _session.id, pickIdx: i, outcomeIndex, stake });
    _session.currentRoundResults[i] = { outcomeIndex, stake, correct: data.correct, payout: data.payout, skipped: false };
    renderBalance(data.battleBalance);
    const grid = document.getElementById('picksGrid');
    grid.children[i].outerHTML = renderPickCard(_session.currentRoundPicks[i], i, _session.currentRoundResults[i]);
    if (data.correct) fireConfetti();
  } catch (e) {
    errEl.textContent = e.message || '베팅 실패';
    btn.disabled = false;
    btn.textContent = '베팅';
  }
}

async function goNextRound() {
  if (!_session) return;
  try {
    await apiCall('battleNextRound', { sessionId: _session.id });
    await loadBattleStatus();
  } catch (e) {
    alert(e.message || '다음 라운드로 넘어가지 못했습니다.');
  }
}

function renderEndScreen() {
  const el = document.getElementById('centerCard');
  const allResults = _session.pastRounds.flatMap((r) => r.results).filter((r) => r && !r.skipped);
  const correctCount = allResults.filter((r) => r.correct).length;
  const totalPnl = allResults.reduce((sum, r) => sum + (r.correct ? r.payout - r.stake : -r.stake), 0);
  el.innerHTML = `
    <div class="end-screen">
      <h2>게임 종료!</h2>
      <div class="end-stats">
        <div class="end-stat"><div class="num">${correctCount}/${allResults.length}</div><div class="label">적중</div></div>
        <div class="end-stat"><div class="num" style="color:${totalPnl >= 0 ? 'var(--green)' : 'var(--red)'}">${totalPnl >= 0 ? '+' : ''}${Math.round(totalPnl).toLocaleString()}p</div><div class="label">이번 게임 손익</div></div>
      </div>
      <button class="btn-primary-lg" onclick="startNewSession()">새 게임 시작하기</button>
    </div>
  `;
}

function renderResultsList() {
  const el = document.getElementById('resultsList');
  if (!_session) { el.innerHTML = '<div class="empty-state">아직 결과가 없습니다.</div>'; return; }
  const items = [];
  _session.pastRounds.forEach((round, ri) => {
    round.results.forEach((r, i) => {
      if (r) items.push({ r, question: round.picks[i]?.questionKo, roundNo: ri + 1 });
    });
  });
  if (!items.length) { el.innerHTML = '<div class="empty-state">아직 결과가 없습니다.</div>'; return; }
  el.innerHTML = items.reverse().map(({ r, question, roundNo }) => {
    if (r.skipped) {
      return `<div class="pos-item"><div class="pos-q">R${roundNo} · ${esc(question)}</div><div class="pos-meta tag-void">베팅 안 함</div></div>`;
    }
    const tagClass = r.correct ? 'tag-won' : 'tag-lost';
    const tagLabel = r.correct ? '적중' : '실패';
    const pnl = r.correct ? r.payout - r.stake : -r.stake;
    return `
      <div class="pos-item">
        <div class="pos-q">R${roundNo} · ${esc(question)}</div>
        <div class="pos-meta">${r.stake.toLocaleString()}p <span class="${tagClass}">· ${tagLabel}</span> · ${pnl >= 0 ? '+' : ''}${Math.round(pnl).toLocaleString()}p</div>
      </div>
    `;
  }).join('');
}
</script>

</body>
</html>
