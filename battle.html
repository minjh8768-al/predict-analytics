<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>예측배틀 — Factory Signal</title>
<meta name="description" content="AI의 방향 예측을 이길 수 있을까? 라운드마다 큐레이션되는 5개 실시간 마켓에 가상 포인트로 베팅.">
<style>
  :root {
    --bg: #f5f6fa; --surface: #ffffff; --surface2: #f0f2ff;
    --border: #e2e6f0; --text: #1a1d2e; --text-sub: #5a6075; --text-muted: #9aa0b8;
    --purple: #6c5ce7; --green: #0ea968; --red: #e03040; --yellow: #d97706;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d0d1a; --surface: #16162a; --surface2: #1e1e35;
      --border: #2a2a45; --text: #e8e8f8; --text-sub: #9090b8; --text-muted: #5a5a80;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif; font-size: 13.5px; min-height: 100vh; }

  .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; }
  .logo { font-size: 15px; font-weight: 800; color: var(--purple); text-decoration: none; }
  .logo span { color: var(--text); }
  .header-right { display: flex; align-items: center; gap: 10px; }
  .btn-google { display: flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface2); color: var(--text); font-size: 12.5px; font-weight: 600; cursor: pointer; }
  .btn-logout { font-size: 11.5px; color: var(--text-muted); background: none; border: 1px solid var(--border); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
  .user-name { font-size: 12.5px; color: var(--text-sub); }

  .layout { display: grid; grid-template-columns: 240px 1fr 300px; gap: 14px; padding: 14px; max-width: 1400px; margin: 0 auto; align-items: start; }
  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
  }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
  .card-title { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .04em; font-weight: 700; margin-bottom: 10px; }

  /* ── 좌측: 스탯 + 워치리스트 ── */
  .stat-row { display: flex; justify-content: space-between; padding: 5px 0; font-size: 12.5px; }
  .stat-row .val { font-weight: 700; }
  .val.green { color: var(--green); }
  .val.red { color: var(--red); }
  .val.purple { color: var(--purple); }

  .watch-item { padding: 10px 8px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; }
  .watch-item:hover { background: var(--surface2); }
  .watch-item.active { background: var(--surface2); border-color: var(--purple); }
  .watch-q { font-size: 12px; font-weight: 600; line-height: 1.35; margin-bottom: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .watch-meta { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--text-muted); }
  .watch-meta .arrow.up { color: var(--green); }
  .watch-meta .arrow.down { color: var(--red); }

  /* ── 중앙: 선택된 마켓 ── */
  .center-question { font-size: 17px; font-weight: 800; line-height: 1.4; margin-bottom: 10px; }
  .center-price-row { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
  .center-price { font-size: 28px; font-weight: 800; color: var(--purple); }
  .ai-box { display: flex; align-items: center; gap: 8px; background: var(--surface2); border-radius: 10px; padding: 10px 14px; font-size: 12.5px; margin-bottom: 14px; }
  .ai-box .stars { margin-left: auto; color: var(--yellow); }
  .chart-wrap { margin-bottom: 16px; }
  .chart-wrap svg { width: 100%; height: auto; display: block; }

  .bet-panel { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .outcome-btn { flex: 1; min-width: 110px; padding: 12px; border-radius: 10px; border: 2px solid var(--border); background: var(--surface2); color: var(--text); font-size: 13.5px; font-weight: 700; cursor: pointer; }
  .outcome-btn.yes.selected { border-color: var(--green); color: var(--green); }
  .outcome-btn.no.selected { border-color: var(--red); color: var(--red); }
  .outcome-btn:disabled { opacity: .5; cursor: not-allowed; }
  #stakeInput { width: 110px; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface2); color: var(--text); font-size: 14px; }
  .btn-submit { padding: 12px 20px; border-radius: 10px; border: none; background: var(--purple); color: #fff; font-size: 13.5px; font-weight: 700; cursor: pointer; }
  .btn-submit:disabled { opacity: .5; cursor: not-allowed; }
  #payoutPreview { font-size: 12px; color: var(--text-sub); width: 100%; margin-top: 4px; }
  #placeError { font-size: 12px; color: var(--red); width: 100%; min-height: 16px; }
  .disclaimer { font-size: 10.5px; color: var(--text-muted); margin-top: 10px; line-height: 1.5; }

  /* ── 우측: 탭 ── */
  .tabs { display: flex; gap: 6px; margin-bottom: 10px; }
  .tab-btn { flex: 1; padding: 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface2); color: var(--text-sub); font-size: 12px; font-weight: 700; cursor: pointer; }
  .tab-btn.active { background: var(--purple); color: #fff; border-color: var(--purple); }
  .pos-item { padding: 10px 0; border-bottom: 1px solid var(--border); }
  .pos-item:last-child { border-bottom: none; }
  .pos-q { font-size: 12px; font-weight: 600; margin-bottom: 4px; }
  .pos-meta { font-size: 11px; color: var(--text-muted); }
  .tag-won { color: var(--green); font-weight: 700; }
  .tag-lost { color: var(--red); font-weight: 700; }
  .tag-void { color: var(--text-muted); font-weight: 700; }
  .empty-state { text-align: center; padding: 24px 0; color: var(--text-muted); font-size: 12.5px; }
</style>
</head>
<body>

<div class="header">
  <a href="index.html" class="logo">Factory<span> Signal</span> · 예측배틀</a>
  <div class="header-right">
    <span class="user-name" id="userName" style="display:none"></span>
    <button class="btn-google" id="loginBtn" onclick="battleLogin()">Google로 로그인</button>
    <button class="btn-logout" id="logoutBtn" style="display:none" onclick="battleLogout()">로그아웃</button>
  </div>
</div>

<div class="layout">

  <!-- 좌측: 스탯 + 워치리스트 -->
  <div>
    <div class="card">
      <div class="card-title">내 계좌</div>
      <div class="stat-row"><span>시드머니</span><span class="val">10,000p</span></div>
      <div class="stat-row"><span>보유 포인트</span><span class="val purple" id="statBalance">-</span></div>
      <div class="stat-row"><span>평가손익</span><span class="val" id="statPnl">-</span></div>
      <div class="stat-row"><span>수익률</span><span class="val" id="statReturn">-</span></div>
    </div>
    <div class="card">
      <div class="card-title">이번 라운드 픽</div>
      <div id="watchList"><div class="empty-state">불러오는 중...</div></div>
    </div>
  </div>

  <!-- 중앙: 선택된 마켓 -->
  <div class="card">
    <div class="center-question" id="centerQuestion">불러오는 중...</div>
    <div class="center-price-row">
      <span class="center-price" id="centerPrice">-</span>
      <span style="color:var(--text-muted);font-size:12px">확률</span>
    </div>
    <div class="ai-box">
      <span id="centerAiArrow"></span>
      <span id="centerAiLabel">AI 예측</span>
      <span class="stars" id="centerAiStars"></span>
    </div>
    <div class="chart-wrap" id="chartWrap"></div>

    <div class="bet-panel">
      <button class="outcome-btn yes" id="btnYes" onclick="selectOutcome(0)">예</button>
      <button class="outcome-btn no" id="btnNo" onclick="selectOutcome(1)">아니요</button>
      <input id="stakeInput" type="number" min="10" max="2000" step="10" value="100" oninput="updatePayoutPreview()">
      <button class="btn-submit" id="submitBtn" onclick="submitPosition()" disabled>방향을 선택하세요</button>
      <div id="payoutPreview">-</div>
      <div id="placeError"></div>
    </div>
    <div class="disclaimer">가상 포인트이며 실제 현금 가치가 없습니다. 실제 자산으로 출금·환전할 수 없습니다.</div>
  </div>

  <!-- 우측: 내 포지션 / 체결내역 -->
  <div class="card">
    <div class="tabs">
      <button class="tab-btn active" id="tabOpenBtn" onclick="switchTab('open')">내 포지션</button>
      <button class="tab-btn" id="tabSettledBtn" onclick="switchTab('settled')">체결내역</button>
    </div>
    <div id="openList"><div class="empty-state">로그인이 필요합니다.</div></div>
    <div id="settledList" style="display:none"><div class="empty-state">로그인이 필요합니다.</div></div>
  </div>

</div>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
  import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
    from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';

  const firebaseConfig = {
    apiKey: "AIzaSyDPnNCfbUSQXfmYhT4g1NMQcfXrVC20Cp0",
    authDomain: "zenithgate-172ec.firebaseapp.com",
    projectId: "zenithgate-172ec",
    storageBucket: "zenithgate-172ec.firebasestorage.app",
    messagingSenderId: "237160059075",
    appId: "1:237160059075:web:3cdf8044bf24a7519c1276"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const provider = new GoogleAuthProvider();
  window._battleAuth = auth;

  window.battleLogin = async function() {
    try { await signInWithPopup(auth, provider); }
    catch (e) { console.warn('로그인 실패:', e.message); }
  };
  window.battleLogout = function() { signOut(auth); };

  onAuthStateChanged(auth, (u) => {
    document.getElementById('loginBtn').style.display = u ? 'none' : 'flex';
    document.getElementById('logoutBtn').style.display = u ? 'inline-block' : 'none';
    const nameEl = document.getElementById('userName');
    nameEl.style.display = u ? 'inline' : 'none';
    nameEl.textContent = u ? (u.displayName || u.email) : '';
    loadBattleStatus();
  });
</script>

<script>
const BATTLE_STARTING_BALANCE = 10000;
let _picks = [];
let _selectedIdx = 0;
let _selectedOutcome = null;
let _currentRoundId = null;
let _openPositions = [];
let _settledPositions = [];

function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// ── 차트 (index.html의 catmullPath/buildChartSVG를 단일 시리즈용으로 이식) ──
function catmullPath(pts) {
  if (pts.length < 2) return '';
  let d = `M${pts[0].x.toFixed(1)},${pts[0].y.toFixed(1)}`;
  for (let i = 1; i < pts.length; i++) {
    const p0 = pts[Math.max(0,i-2)], p1 = pts[i-1], p2 = pts[i], p3 = pts[Math.min(pts.length-1,i+1)];
    d += ` C${(p1.x+(p2.x-p0.x)/6).toFixed(1)},${(p1.y+(p2.y-p0.y)/6).toFixed(1)} ${(p2.x-(p3.x-p1.x)/6).toFixed(1)},${(p2.y-(p3.y-p1.y)/6).toFixed(1)} ${p2.x.toFixed(1)},${p2.y.toFixed(1)}`;
  }
  return d;
}

function buildSingleChartSVG(history, color) {
  const W=600,H=220,PL=34,PR=8,PT=10,PB=18,cW=W-PL-PR,cH=H-PT-PB;
  if (!history.length) return '<div class="empty-state">차트 데이터 없음</div>';
  const ts = history.map(p=>p.t);
  const minT = Math.min(...ts), maxT = Math.max(...ts)||minT+1;
  const maxP = Math.max(...history.map(p=>p.p), 0.12);
  const xS = t => PL+(t-minT)/(maxT-minT)*cW;
  const yS = p => PT+cH-(p/Math.min(maxP*1.15,1))*cH;
  let svg = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
  [0.2,0.4,0.6,0.8].filter(v=>v<maxP*1.2).forEach(v => {
    const y = yS(v).toFixed(1);
    svg += `<line x1="${PL}" y1="${y}" x2="${W-PR}" y2="${y}" stroke="#8888" stroke-width="0.6" stroke-dasharray="3,3"/>
            <text x="${PL-4}" y="${(+y+3.5).toFixed(1)}" font-size="9" fill="#9ca3af" text-anchor="end">${Math.round(v*100)}%</text>`;
  });
  const step = Math.max(1, Math.floor(history.length/80));
  const pts = history.filter((_,i)=>i%step===0||i===history.length-1).map(d=>({x:xS(d.t),y:yS(d.p)}));
  svg += `<path d="${catmullPath(pts)}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`;
  return svg + '</svg>';
}

async function loadChartFor(pick) {
  const wrap = document.getElementById('chartWrap');
  wrap.innerHTML = '<div class="empty-state">차트 불러오는 중...</div>';
  try {
    const weekAgo = Math.floor(Date.now()/1000) - 7*86400;
    const r = await fetch(`https://clob.polymarket.com/prices-history?market=${pick.conditionId}&startTs=${weekAgo}&fidelity=60`, { cache: 'no-store' });
    let history = [];
    if (r.ok) history = (await r.json()).history || [];
    wrap.innerHTML = history.length > 3
      ? buildSingleChartSVG(history, '#6c5ce7')
      : '<div class="empty-state">아직 차트 데이터가 충분하지 않습니다.</div>';
  } catch (e) {
    wrap.innerHTML = '<div class="empty-state">차트를 불러올 수 없습니다.</div>';
  }
}

async function loadBattleStatus() {
  const u = window._battleAuth && window._battleAuth.currentUser;
  const headers = { 'Content-Type': 'application/json' };
  if (u) headers['Authorization'] = `Bearer ${await u.getIdToken()}`;

  try {
    const r = await fetch('/api/bet', { method: 'POST', headers, body: JSON.stringify({ action: 'battleStatus' }) });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || '조회 실패');
    _currentRoundId = data.roundId;
    _picks = data.picks || [];
    _openPositions = data.openPositions || [];
    _settledPositions = data.settledPositions || [];
    renderWatchlist();
    renderCenter();
    renderStats(data.battleBalance);
    renderOpenList();
    renderSettledList();
  } catch (e) {
    document.getElementById('watchList').innerHTML = `<div class="empty-state">불러오기 실패: ${esc(e.message)}</div>`;
  }
}

function renderWatchlist() {
  const el = document.getElementById('watchList');
  if (!_picks.length) { el.innerHTML = '<div class="empty-state">곧 새 라운드가 시작됩니다...</div>'; return; }
  el.innerHTML = _picks.map((p, i) => {
    const pct = Math.round((p.entryPrice || 0) * 100);
    const arrow = p.aiDirection === 'up' ? '📈' : '📉';
    return `
      <div class="watch-item ${i === _selectedIdx ? 'active' : ''}" onclick="selectPick(${i})">
        <div class="watch-q">${esc(p.question)}</div>
        <div class="watch-meta"><span class="arrow ${p.aiDirection}">${arrow} AI</span><span>${pct}%</span></div>
      </div>
    `;
  }).join('');
}

function selectPick(i) {
  _selectedIdx = i;
  _selectedOutcome = null;
  renderWatchlist();
  renderCenter();
}

function renderCenter() {
  const p = _picks[_selectedIdx];
  if (!p) return;
  document.getElementById('centerQuestion').textContent = p.question;
  document.getElementById('centerPrice').textContent = `${Math.round((p.entryPrice||0)*100)}%`;
  document.getElementById('centerAiArrow').textContent = p.aiDirection === 'up' ? '📈' : '📉';
  document.getElementById('centerAiLabel').textContent = `AI 예측: ${p.aiDirection === 'up' ? '상승' : '하락'}`;
  document.getElementById('centerAiStars').textContent = '★'.repeat(p.aiConfidence) + '☆'.repeat(3 - p.aiConfidence);

  const btnYes = document.getElementById('btnYes');
  const btnNo = document.getElementById('btnNo');
  btnYes.textContent = p.outcomes[0] || '예';
  btnNo.textContent = p.outcomes[1] || '아니요';
  const already = !!p.myPosition;
  btnYes.disabled = already;
  btnNo.disabled = already;
  btnYes.classList.remove('selected');
  btnNo.classList.remove('selected');
  document.getElementById('submitBtn').disabled = true;
  document.getElementById('submitBtn').textContent = already ? '이 마켓엔 이미 베팅했습니다' : '방향을 선택하세요';
  document.getElementById('placeError').textContent = '';
  updatePayoutPreview();

  loadChartFor(p);
}

function selectOutcome(idx) {
  const p = _picks[_selectedIdx];
  if (!p || p.myPosition) return;
  _selectedOutcome = idx;
  document.getElementById('btnYes').classList.toggle('selected', idx === 0);
  document.getElementById('btnNo').classList.toggle('selected', idx === 1);
  const btn = document.getElementById('submitBtn');
  btn.disabled = false;
  btn.textContent = '베팅하기';
  updatePayoutPreview();
}

function updatePayoutPreview() {
  const el = document.getElementById('payoutPreview');
  const p = _picks[_selectedIdx];
  if (!p || _selectedOutcome == null) { el.textContent = '-'; return; }
  const price = _selectedOutcome === 0 ? p.entryPrice : 1 - p.entryPrice;
  const stake = Number(document.getElementById('stakeInput').value);
  if (!(price > 0) || !(stake > 0)) { el.textContent = '-'; return; }
  const payout = Math.round((stake / price) * 100) / 100;
  el.textContent = `적중 시 ${payout.toLocaleString()} 포인트 획득 (스테이크 포함)`;
}

async function submitPosition() {
  const u = window._battleAuth && window._battleAuth.currentUser;
  const errEl = document.getElementById('placeError');
  errEl.textContent = '';
  if (!u) { window.battleLogin(); return; }
  const p = _picks[_selectedIdx];
  if (!p || _selectedOutcome == null || !_currentRoundId) return;

  const stake = Number(document.getElementById('stakeInput').value);
  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = '베팅 중...';

  try {
    const idToken = await u.getIdToken();
    const r = await fetch('/api/bet', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${idToken}` },
      body: JSON.stringify({ action: 'battlePlace', roundId: _currentRoundId, marketId: p.marketId, outcomeIndex: _selectedOutcome, stake }),
    });
    const body = await r.json();
    if (!r.ok) throw new Error(body.error || '베팅 실패');
    await loadBattleStatus();
  } catch (e) {
    errEl.textContent = e.message || '베팅 실패';
    btn.disabled = false;
    btn.textContent = '베팅하기';
  }
}

function renderStats(battleBalance) {
  const balEl = document.getElementById('statBalance');
  const pnlEl = document.getElementById('statPnl');
  const retEl = document.getElementById('statReturn');
  if (battleBalance == null) {
    balEl.textContent = '로그인 필요';
    pnlEl.textContent = '-';
    retEl.textContent = '-';
    return;
  }
  balEl.textContent = `${battleBalance.toLocaleString()}p`;

  const positionsValue = _openPositions.reduce((sum, b) => sum + (b.stake * (b.currentPrice / b.entryPrice)), 0);
  const estimatedAssets = battleBalance + positionsValue;
  const pnl = Math.round(estimatedAssets - BATTLE_STARTING_BALANCE);
  const returnPct = (pnl / BATTLE_STARTING_BALANCE) * 100;

  pnlEl.textContent = `${pnl >= 0 ? '+' : ''}${pnl.toLocaleString()}p`;
  pnlEl.className = 'val ' + (pnl > 0 ? 'green' : pnl < 0 ? 'red' : '');
  retEl.textContent = `${returnPct >= 0 ? '+' : ''}${returnPct.toFixed(2)}%`;
  retEl.className = 'val ' + (returnPct > 0 ? 'green' : returnPct < 0 ? 'red' : '');
}

function renderOpenList() {
  const el = document.getElementById('openList');
  const u = window._battleAuth && window._battleAuth.currentUser;
  if (!u) { el.innerHTML = '<div class="empty-state">로그인이 필요합니다.</div>'; return; }
  if (!_openPositions.length) { el.innerHTML = '<div class="empty-state">보유 중인 포지션이 없습니다.</div>'; return; }
  el.innerHTML = _openPositions.map((b) => {
    const pnl = Math.round(b.stake * (b.currentPrice / b.entryPrice) - b.stake);
    const pnlClass = pnl > 0 ? 'tag-won' : pnl < 0 ? 'tag-lost' : '';
    return `
      <div class="pos-item">
        <div class="pos-q">${esc(b.marketQuestion)}</div>
        <div class="pos-meta">
          ${esc(b.outcomeLabel)} · ${b.stake.toLocaleString()}p 진입 ${Math.round(b.entryPrice*100)}% → 현재 ${Math.round(b.currentPrice*100)}%
          <span class="${pnlClass}"> · ${pnl >= 0 ? '+' : ''}${pnl.toLocaleString()}p</span>
        </div>
      </div>
    `;
  }).join('');
}

function renderSettledList() {
  const el = document.getElementById('settledList');
  const u = window._battleAuth && window._battleAuth.currentUser;
  if (!u) { el.innerHTML = '<div class="empty-state">로그인이 필요합니다.</div>'; return; }
  if (!_settledPositions.length) { el.innerHTML = '<div class="empty-state">아직 체결 내역이 없습니다.</div>'; return; }
  const tagClass = { won: 'tag-won', lost: 'tag-lost', void: 'tag-void' };
  const tagLabel = { won: '적중', lost: '실패', void: '무효' };
  el.innerHTML = _settledPositions.map((b) => `
    <div class="pos-item">
      <div class="pos-q">${esc(b.marketQuestion)}</div>
      <div class="pos-meta">
        ${esc(b.outcomeLabel)} · ${b.stake.toLocaleString()}p 베팅
        <span class="${tagClass[b.status] || ''}"> · ${tagLabel[b.status] || b.status}</span>
        · ${(b.payout || 0).toLocaleString()}p 정산
      </div>
    </div>
  `).join('');
}

function switchTab(tab) {
  document.getElementById('tabOpenBtn').classList.toggle('active', tab === 'open');
  document.getElementById('tabSettledBtn').classList.toggle('active', tab === 'settled');
  document.getElementById('openList').style.display = tab === 'open' ? 'block' : 'none';
  document.getElementById('settledList').style.display = tab === 'settled' ? 'block' : 'none';
}

setInterval(loadBattleStatus, 30000);
</script>
